name: Auto-Fix Prettier
on:
  push:
    branches:
      - chore/zero-cost-launch-readiness

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/employer-invitation.spec.ts
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/employer-invitation.spec.ts
          git commit -m "style: auto-format code with prettier" || echo "No changes to commit"
          git push