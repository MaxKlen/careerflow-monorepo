name: Auto-Fix Prettier

on:
  push:
    branches:
      - chore/zero-cost-launch-readiness

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/e2e/employer-invitation.spec.ts
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tests/e2e/employer-invitation.spec.ts
          git commit -m "style: auto-format" || exit 0
          git push
