name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: careerflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Install, lint, typecheck, unit tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    name: Public browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e tests/e2e/welcome.spec.ts

  database-smoke:
    name: Database smoke, API integration, and automated M11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://careerflow:careerflow@127.0.0.1:5432/careerflow
      PORT: 4000
      APP_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001
      EMPLOYER_URL: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:4000
      SESSION_SECRET: local-ci-session-secret-012345678901234567890123
      STORAGE_DIR: /tmp/careerflow-uploads
      EMAIL_ENABLED: false
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      INTEGRATION_API_URL: http://127.0.0.1:4000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careerflow
          POSTGRES_PASSWORD: careerflow
          POSTGRES_DB: careerflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerflow -d careerflow"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p /tmp/careerflow-uploads && pnpm db:push
      - name: Start API
        run: nohup pnpm dev:api > /tmp/careerflow-api.log 2>&1 &
      - name: Start candidate web
        run: nohup pnpm dev:web > /tmp/careerflow-web.log 2>&1 &
      - name: Start employer web
        run: nohup pnpm dev:employer > /tmp/careerflow-employer.log 2>&1 &
      - name: Wait for services
        run: |
          for url in http://127.0.0.1:4000/health http://127.0.0.1:3000/ http://127.0.0.1:3002/; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" > /dev/null; then break; fi
              sleep 2
            done
            curl --fail --silent --show-error "$url" > /dev/null
          done
      - name: Run synthetic smoke
        run: bash scripts/smoke.sh
      - name: Run API integration tests
        run: pnpm test:integration
      - name: Run automated M11 flow
        env:
          CI: true
          E2E_MANAGED: true
          M11_E2E: true
          WEB_URL: http://127.0.0.1:3000
          PLAYWRIGHT_EMPLOYER_URL: http://127.0.0.1:3002
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e tests/e2e/employer-invitation.spec.ts
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: careerflow-service-logs
          path: /tmp/careerflow-*.log
